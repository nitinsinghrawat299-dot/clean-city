{% extends "base.html" %}
{% block title %}{{ t('forgot_password_title') }} — SPR{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h1>{{ t('forgot_password_title') }}</h1>
    <p class="sub">{{ t('forgot_password_subtitle') }}</p>

    <form method="POST" action="{{ url_for('forgot_password') }}">
      <div class="field">
        <label for="email">{{ t('email_label') }}</label>
        <input type="email" id="email" name="email" required autofocus placeholder="you@example.com">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">{{ t('send_reset_link') }}</button>
    </form>

    <p class="auth-footer">{{ t('remembered_it') }} <a href="{{ url_for('citizen_login') }}">{{ t('back_to_login') }}</a></p>
  </div>
</section>
{% endblock %}
