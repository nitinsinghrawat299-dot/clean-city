{% extends "base.html" %}
{% block title %}{{ t('signup_title') }} — SPR{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h1>{{ t('signup_title') }}</h1>
    <p class="sub">{{ t('signup_subtitle') }}</p>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="field">
        <label for="username">{{ t('username_label') }}</label>
        <input type="text" id="username" name="username" required minlength="3" autofocus placeholder="{{ t('username_label') }}">
        <p class="field-note">{{ t('username_hint') }}</p>
      </div>

      <div class="field">
        <label for="email">{{ t('email_label') }}</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="password">{{ t('password_label') }}</label>
        <div class="input-row">
          <input type="password" id="password" name="password" required minlength="4" placeholder="{{ t('password_label') }}">
          <button type="button" class="toggle-visibility" onclick="const f=document.getElementById('password'); f.type = f.type==='password' ? 'text' : 'password'; this.textContent = f.type==='password' ? '👁️' : '🙈';">👁️</button>
        </div>
        <p class="field-note">{{ t('password_hint') }}</p>
      </div>

      <div class="field">
        <label for="confirm_password">{{ t('confirm_password_label') }}</label>
        <div class="input-row">
          <input type="password" id="confirm_password" name="confirm_password" required placeholder="{{ t('confirm_password_label') }}">
          <button type="button" class="toggle-visibility" onclick="const f=document.getElementById('confirm_password'); f.type = f.type==='password' ? 'text' : 'password'; this.textContent = f.type==='password' ? '👁️' : '🙈';">👁️</button>
        </div>
      </div>

      <div class="field">
        <label>{{ t('preferred_language') }}</label>
        <div style="display:flex; gap:10px;">
          <label class="pill" style="cursor:pointer; display:flex; align-items:center; gap:6px;">
            <input type="radio" name="language" value="en" checked style="margin:0;"> {{ t('lang_english') }}
          </label>
          <label class="pill" style="cursor:pointer; display:flex; align-items:center; gap:6px;">
            <input type="radio" name="language" value="hi" style="margin:0;"> {{ t('lang_hindi') }}
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">{{ t('signup_btn') }}</button>
    </form>

    <p class="auth-footer">{{ t('have_account') }} <a href="{{ url_for('citizen_login') }}">{{ t('login_link') }}</a></p>
  </div>
</section>
{% endblock %}
