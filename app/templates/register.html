{% extends "base.html" %}
{% block title %}Create Account — SPR{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="sub">Join SPR and make a difference.</p>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required minlength="3" autofocus placeholder="Choose a username">
        <p class="field-note">At least 3 characters. This is what other citizens see on the leaderboard.</p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-row">
          <input type="password" id="password" name="password" required minlength="4" placeholder="Create a password">
          <button type="button" class="toggle-visibility" onclick="const f=document.getElementById('password'); f.type = f.type==='password' ? 'text' : 'password'; this.textContent = f.type==='password' ? '👁️' : '🙈';">👁️</button>
        </div>
        <p class="field-note">At least 4 characters.</p>
      </div>

      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <div class="input-row">
          <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your password">
          <button type="button" class="toggle-visibility" onclick="const f=document.getElementById('confirm_password'); f.type = f.type==='password' ? 'text' : 'password'; this.textContent = f.type==='password' ? '👁️' : '🙈';">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Register</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="{{ url_for('citizen_login') }}">Login here</a></p>
  </div>
</section>
{% endblock %}
