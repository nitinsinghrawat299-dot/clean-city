{% extends "base.html" %}
{% block title %}Reset Password — SPR{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h1>Reset Your Password</h1>
    <p class="sub">Choose a new password for your account.</p>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
      <div class="field">
        <label for="password">New Password</label>
        <div class="input-row">
          <input type="password" id="password" name="password" required minlength="4" autofocus placeholder="Create a new password">
          <button type="button" class="toggle-visibility" onclick="const f=document.getElementById('password'); f.type = f.type==='password' ? 'text' : 'password'; this.textContent = f.type==='password' ? '👁️' : '🙈';">👁️</button>
        </div>
        <p class="field-note">At least 4 characters.</p>
      </div>

      <div class="field">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your new password">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Reset Password</button>
    </form>
  </div>
</section>
{% endblock %}
