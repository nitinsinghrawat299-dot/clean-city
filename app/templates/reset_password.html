{% extends "base.html" %}
{% block title %}{{ t('reset_password_title') }} — SPR{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h1>{{ t('reset_password_title') }}</h1>
    <p class="sub">{{ t('reset_password_title') }}</p>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
      <div class="field">
        <label for="password">{{ t('new_password_label') }}</label>
        <div class="input-row">
          <input type="password" id="password" name="password" required minlength="4" autofocus placeholder="{{ t('new_password_label') }}">
          <button type="button" class="toggle-visibility" onclick="const f=document.getElementById('password'); f.type = f.type==='password' ? 'text' : 'password'; this.textContent = f.type==='password' ? '👁️' : '🙈';">👁️</button>
        </div>
        <p class="field-note">{{ t('password_hint') }}</p>
      </div>

      <div class="field">
        <label for="confirm_password">{{ t('confirm_new_password_label') }}</label>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="{{ t('confirm_new_password_label') }}">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">{{ t('reset_password_btn') }}</button>
    </form>
  </div>
</section>
{% endblock %}
