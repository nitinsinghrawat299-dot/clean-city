{% extends "base.html" %}
{% block title %}Forgot Password — SPR{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h1>Forgot Password?</h1>
    <p class="sub">Enter your email and we'll send you a link to reset it.</p>

    <form method="POST" action="{{ url_for('forgot_password') }}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus placeholder="you@example.com">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Send Reset Link</button>
    </form>

    <p class="auth-footer">Remembered it? <a href="{{ url_for('citizen_login') }}">Back to login</a></p>
  </div>
</section>
{% endblock %}
