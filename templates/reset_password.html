<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - CleanCity</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<nav>
    <h2>🌱 CleanCity</h2>
</nav>


<main>

<section class="card">

    <h2>
        🔑 Choose a New Password
    </h2>

    <p>
        Pick a new password for your account.
    </p>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="flash">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST" action="/reset-password/{{ token }}" id="reset-form">

        <label>
            New password
        </label>

        <div class="password-field">

            <input
                type="password"
                name="password"
                id="new_password"
                placeholder="At least 4 characters"
                minlength="4"
                required
            >

            <button
                type="button"
                class="toggle-password"
                data-target="new_password"
                aria-label="Show password"
            >
                👁️
            </button>

        </div>


        <label>
            Confirm new password
        </label>

        <div class="password-field">

            <input
                type="password"
                name="confirm_password"
                id="confirm_new_password"
                placeholder="Re-enter your new password"
                minlength="4"
                required
            >

            <button
                type="button"
                class="toggle-password"
                data-target="confirm_new_password"
                aria-label="Show password"
            >
                👁️
            </button>

        </div>

        <p id="password-mismatch" class="field-hint field-error" hidden>
            Passwords do not match.
        </p>


        <button type="submit">
            ✅ Reset Password
        </button>

    </form>

</section>

</main>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>

<script>

    document.getElementById("reset-form").addEventListener(
        "submit",
        function (event) {

            const password = document.getElementById("new_password").value;

            const confirm = document.getElementById("confirm_new_password").value;

            const mismatchNote = document.getElementById("password-mismatch");

            if (password !== confirm) {

                event.preventDefault();

                mismatchNote.hidden = false;

            } else {

                mismatchNote.hidden = true;

            }

        }
    );

</script>


</body>
</html>
